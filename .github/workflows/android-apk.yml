name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check preinstalled Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Live provider integration tests (real network)
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test --test-concurrency=1 --test-reporter=tap tests/live/*.test.ts 2>&1 | node scripts/annotate-tap.mjs

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk VideoDownloader-v1.0.0-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-apk
          path: VideoDownloader-*.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Video Downloader test build ${{ github.run_number }}
          body: Test APK (signed with the debug key, for sideloading only).
          files: VideoDownloader-*.apk
